[project]
name = "fanvil-homeassistant"
version = "0.3.0"
description = "Home Assistant integration for Fanvil IP door phones"
requires-python = ">=3.14.2"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]


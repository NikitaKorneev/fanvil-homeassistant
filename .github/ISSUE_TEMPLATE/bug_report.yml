name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: Model and firmware
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines (custom_components.fanvil) and diagnostics
      render: text
